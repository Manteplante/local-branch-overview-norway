[project]
name = "local-branch-overview"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manteplante", email = "matiasmantepizarro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "folium>=0.20.0",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "streamlit-folium>=0.27.4",
]

[project.scripts]
local-branch-overview = "local_branch_overview:main"
scrape-branches = "local_branch_overview.scraper.run:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # the app's `backend` package lives at the repo root
