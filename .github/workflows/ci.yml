name: CI

# One run per push: a feature or Dependabot branch's pushes, and the merge commit on main (main
# only changes by merging a PR). No pull_request trigger: a PR's checks are the push run on its
# head commit, so it would only run the same job twice.
on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'dependabot/**'

# The job only reads the repository: its GITHUB_TOKEN can change nothing.
permissions:
  contents: read

# A newer push to the same feature branch cancels its unfinished run; main's runs finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run checks
        run: make ci
